<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI 面试助手</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="app">
      <!-- 顶部栏 -->
      <header class="header">
        <div class="header-left">
          <h1 class="logo">AI 面试助手</h1>
        </div>
        <div class="header-center">
          <div class="mode-switch">
            <button class="mode-btn active" id="modeCandidateBtn" data-mode="candidate">面试者模式</button>
            <button class="mode-btn" id="modeInterviewerBtn" data-mode="interviewer">面试官模式</button>
          </div>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="settingsBtn" title="设置">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="10" cy="10" r="3"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.4 3.4l1.4 1.4M15.2 15.2l1.4 1.4M3.4 16.6l1.4-1.4M15.2 4.8l1.4-1.4"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 设置面板 -->
      <div class="settings-panel hidden" id="settingsPanel">
        <h3>设置</h3>
        <div class="setting-item">
          <label>识别语言</label>
          <select id="langSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="auto">自动检测</option>
          </select>
        </div>
        <div class="setting-item">
          <label>音频输入设备</label>
          <select id="audioDeviceSelect"><option value="">默认设备</option></select>
        </div>
        <div class="setting-item toggle-item">
          <label for="systemAudioToggle">捕获系统音频（对方声音）</label>
          <input type="checkbox" id="systemAudioToggle" />
        </div>
        <div class="setting-hint">开启后可识别视频通话中对方的声音，首次使用需授权屏幕录制权限</div>
      </div>

      <!-- 主内容：双栏布局 -->
      <div class="main-content">
        <!-- 左侧：转写 + 知识库 -->
        <div class="panel panel-left">
          <div class="panel-section transcript-section">
            <div class="section-header">
              <h2>实时转写</h2>
              <div class="transcript-actions">
                <button class="small-btn" id="clearTranscriptBtn">清空</button>
              </div>
            </div>
            <div class="transcript-area" id="transcriptArea">
              <div class="placeholder-text">点击下方按钮开始录音...</div>
            </div>
            <div class="record-controls">
              <button class="record-btn" id="recordBtn">
                <span class="record-icon" id="recordIcon"></span>
                <span id="recordLabel">开始录音</span>
              </button>
              <span class="record-status" id="statusText"></span>
            </div>
          </div>

          <div class="panel-section pdf-section">
            <div class="section-header">
              <h2>知识库</h2>
              <button class="small-btn primary" id="uploadPDFBtn">+ 上传简历/文档</button>
            </div>

            <!-- 分析进度面板 -->
            <div class="agent-panel hidden" id="agentPanel">
              <div class="agent-steps" id="agentSteps"></div>
              <div class="agent-content" id="agentContent"></div>
            </div>

            <!-- 知识点列表 -->
            <div class="pdf-list" id="pdfList">
              <div class="placeholder-text">上传简历或技术文档，AI 自动分析并生成面试知识库</div>
            </div>
            <div class="pdf-status" id="pdfStatus"></div>
          </div>
        </div>

        <!-- 右侧：AI 回答 + 历史 -->
        <div class="panel panel-right">
          <!-- 面试者模式：AI 回答 -->
          <div class="panel-section ai-section" id="candidatePanel">
            <div class="section-header">
              <h2>AI 助手</h2>
              <button class="small-btn" id="triggerAIBtn">手动触发 AI</button>
            </div>
            <div class="ai-question" id="aiQuestion"></div>
            <div class="ai-response" id="aiResponse">
              <div class="placeholder-text">AI 回答将显示在这里...</div>
            </div>
            <div class="ai-citations" id="aiCitations"></div>
          </div>

          <!-- 面试官模式 -->
          <div class="panel-section interviewer-section hidden" id="interviewerPanel">
            <div class="section-header">
              <h2>面试官工具</h2>
            </div>
            <div class="interviewer-controls">
              <div class="setting-item">
                <label>职位描述 (JD)</label>
                <textarea id="jdInput" rows="3" placeholder="输入职位要求..."></textarea>
              </div>
              <div class="interviewer-actions">
                <button class="small-btn primary" id="recommendQuestionsBtn">AI 推荐问题</button>
                <button class="small-btn" id="evaluateAnswerBtn">评估回答</button>
              </div>
            </div>
            <div class="ai-response" id="interviewerResponse">
              <div class="placeholder-text">AI 分析将显示在这里...</div>
            </div>
          </div>

          <!-- 历史记录 -->
          <div class="panel-section history-section">
            <div class="section-header">
              <h2>对话历史</h2>
              <button class="small-btn" id="clearHistoryBtn">清空</button>
            </div>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>

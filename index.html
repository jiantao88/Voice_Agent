<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>面试助手 - 语音转文字</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="app">
      <!-- 设置按钮 -->
      <button class="settings-btn" id="settingsBtn" title="设置">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="10" r="3"/>
          <path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M3.4 3.4l1.4 1.4M15.2 15.2l1.4 1.4M3.4 16.6l1.4-1.4M15.2 4.8l1.4-1.4"/>
        </svg>
      </button>

      <!-- 设置面板 -->
      <div class="settings-panel hidden" id="settingsPanel">
        <h3>设置</h3>

        <div class="setting-item">
          <label>识别模式</label>
          <select id="modeSelect">
            <option value="doubao">豆包流式 (实时识别)</option>
            <option value="cloud">云端 API (OpenAI Whisper)</option>
            <option value="local">本地模型 (whisper.cpp)</option>
          </select>
        </div>

        <div class="setting-item" id="apiKeyGroup" style="display:none">
          <label>OpenAI API Key</label>
          <input type="password" id="apiKeyInput" placeholder="sk-..." />
        </div>

        <div class="setting-item">
          <label>识别语言</label>
          <select id="langSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="auto">自动检测</option>
          </select>
        </div>

        <div class="setting-item">
          <label>音频来源</label>
          <select id="audioSourceSelect">
            <option value="mic">麦克风 (自己的声音)</option>
            <option value="system">系统音频 (会议软件声音)</option>
          </select>
        </div>

        <div class="setting-item">
          <label>音频输入设备</label>
          <select id="audioDeviceSelect">
            <option value="">默认设备</option>
          </select>
        </div>

        <div class="setting-hint">
          提示：捕获系统音频需要安装 BlackHole 虚拟音频驱动，并在「音频 MIDI 设置」中创建多输出设备。
        </div>
      </div>

      <!-- 主界面 -->
      <h1 class="title">面试助手</h1>
      <p class="subtitle" id="statusText">点击按钮开始实时识别</p>

      <button class="record-btn" id="recordBtn">
        <span id="recordLabel">开始录音</span>
      </button>

      <!-- 结果区域 -->
      <div class="result-area">
        <div class="result-text" id="resultText">识别结果将显示在这里...</div>
      </div>

      <!-- 操作按钮 -->
      <div class="actions">
        <button class="action-btn" id="copyBtn">复制文字</button>
        <button class="action-btn secondary" id="clearBtn">清空</button>
      </div>
    </div>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
